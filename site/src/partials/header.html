<header class="top">
  <div class="wrap top-in">
    <a class="brand" href="{{HOME}}" aria-label="SVGcinema home">
      <svg class="logo" viewBox="{{LOGO_VB}}" role="img" aria-label="SVGcinema">
        <title>SVGcinema</title>
        {{LOGO}}
      </svg>
    </a>
    <nav class="nav" aria-label="Site">{{NAV}}</nav>
    <div class="top-r">
      <button class="ib" id="themeBtn" type="button" aria-label="Switch theme" title="Switch theme">
        <svg
          width="18"
          height="18"
          viewBox="0 0 16 16"
          fill="none"
          stroke="currentColor"
          stroke-width="1.4"
          aria-hidden="true"
        >
          <circle cx="8" cy="8" r="5.5" />
          <path d="M8 2.5a5.5 5.5 0 000 11z" fill="currentColor" />
        </svg>
      </button>
      <a class="btn btn-pri btn-sm" href="{{EDITOR_URL}}" target="_blank" rel="noopener" data-editor>
        <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
          <path d="M4 2.8v10.4a.6.6 0 00.9.5l8.2-5.2a.6.6 0 000-1L4.9 2.3a.6.6 0 00-.9.5z" />
        </svg>
        <span><span class="lbl-long">Open the </span>editor</span>
      </a>
    </div>
  </div>
  <div class="ruler" aria-hidden="true"></div>
  <div class="ph-trail" aria-hidden="true"></div>
  <div class="ph" aria-hidden="true"></div>
</header>
