<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>{{TITLE}}</title>
    <meta name="description" content="{{DESCRIPTION}}" />
    <meta name="svgcinema-editor" content="{{EDITOR_URL}}" />
    <link rel="icon" href="{{ROOT}}img/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="{{ROOT}}img/apple-touch-icon.png" />
    <script>
      try {
        var t = localStorage.getItem('svgcinema:theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wdth,wght@75..100,400..700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <meta name="claude:viewport-fit-sides" content="cover" />
    <style>
      {{CSS}}
    </style>
  </head>
  <body>
    {{BODY}}
  </body>
</html>
