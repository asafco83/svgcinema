<article class="spec">

    </svg>
  </div>
  <div class="spec-tx">
    <div class="mini" style="--d: 4s">
      <i style="left: 0"></i><i style="left: 50%"></i><i style="left: 100%"></i><u></u>

    <h3>Dash patterns</h3>
    <p>
      Dash patterns blend from one keyframe to the next, even patterns of different lengths, and the offset sends them
      travelling.
    </p>
  </div>
</article>
